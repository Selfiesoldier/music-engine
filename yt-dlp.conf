# yt-dlp configuration for Highrise Music Engine (Render/Cloud hosting)
# This file is automatically read by yt-dlp on startup

# === Plugin Directory (for bgutil POT provider) ===
# Points yt-dlp at the Python site-packages where bgutil plugin is installed
--plugin-dirs /usr/local/lib/python3.11/dist-packages

# === POT (Proof of Origin Token) Provider ===
# Tells the bgutil plugin where the local HTTP PO Token server is running
--extractor-args youtube:getpot_bgutil_baseurl=http://127.0.0.1:4416

# === Network Settings for Cloud ===
--geo-bypass
--no-check-certificate
--socket-timeout 15

# === Suppress noise ===
--no-warnings
