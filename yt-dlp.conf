# yt-dlp configuration for Highrise Music Engine (Render/Cloud hosting)
# This file is automatically read by yt-dlp on startup

# === POT (Proof of Origin Token) Provider ===
# New extractor arg format as of bgutil-ytdlp-pot-provider v1.3.2+
# See: https://github.com/brainicism/bgutil-ytdlp-pot-provider
--extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416

# === Network Settings for Cloud ===
--geo-bypass
--no-check-certificate
--socket-timeout 15

# === Suppress noise ===
--no-warnings
