# yt-dlp configuration for Highrise Music Engine (Render/Cloud hosting)
# This file is automatically read by yt-dlp on startup

# === POT (Proof of Origin Token) Provider ===
# Connects yt-dlp to the local bgutil HTTP server running on port 4416
# This is required for YouTube to accept requests from datacenter IPs
--extractor-args youtube:getpot_bgutil_baseurl=http://127.0.0.1:4416

# === YouTube Player Client Strategy ===
# tv_embedded: Works well on datacenter IPs, minimal bot-detection
# web_embedded: Fallback embedded client
# web: Standard web client
# mweb: Mobile web client  
# android: Android app client
# ios: iOS app client
--extractor-args youtube:player_client=tv_embedded,web_embedded,web,mweb,android,ios

# === Network Settings for Cloud ===
--geo-bypass
--no-check-certificate
--socket-timeout 15

# === Suppress noise ===
--no-warnings
